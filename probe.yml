name: Cloud connectivity probe
on:
  workflow_dispatch:
    inputs:
      author_id:
        description: 'Numeric artist tag ID from existing Tampermonkey backup'
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe one public author page
        env:
          AUTHOR_ID: ${{ inputs.author_id }}
        run: python3 probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe-result.json
          if-no-files-found: warn
